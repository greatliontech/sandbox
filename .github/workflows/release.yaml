name: Release

# The release gate: a tag is cut only after the CI workflow succeeded on
# the pushed commit. The rules that keep the tag on the judged commit live
# in the called workflow (go-release.yml): a push run of this repository,
# a fresh tip-of-main check, and semrel targeting the judged commit SHA.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: greatliontech/actions/.github/workflows/go-release.yml@main
    permissions:
      contents: write
    secrets: inherit
