name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # The Strong row needs unprivileged user namespaces; Ubuntu 24.04
      # restricts them through AppArmor for unconfined programs, which
      # the live tests would otherwise skip past. A host without the
      # knob has no such restriction; a host with it that refuses the
      # write fails here, rather than letting every Strong-row arm skip.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "no AppArmor user-namespace restriction on this host"
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1 -timeout=20m
      # The Strong row's arms, and the cgroup arms — placement, the
      # vacated delegated cgroup, the counters, swap closed to the run
      # — which run only under a delegated subtree: this leg demands
      # both rather than letting them skip, so a runner that cannot
      # create user namespaces or delegate fails here, loudly.
      - name: Live Strong-row and cgroup arms under a delegated scope
        run: systemd-run --user --scope -q -p Delegate=yes env SANDBOX_TEST_REQUIRE_USERNS=1 SANDBOX_TEST_REQUIRE_CGROUPS=1 SANDBOX_TEST_REQUIRE_LANDLOCK=1 go test ./... -count=1 -race -timeout=20m

  # The darwin row on the macOS runners: the OS row demanded, so a
  # runner whose sandbox-exec cannot apply a profile fails here
  # rather than letting the Seatbelt arms skip to the Minimal row.
  test-darwin:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1 -race -timeout=20m
        env:
          SANDBOX_TEST_REQUIRE_SEATBELT: "1"
